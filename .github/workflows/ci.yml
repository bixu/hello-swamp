name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install swamp
        run: curl -fsSL swamp.club/install.sh | sh

      - name: Run ci-checks workflow
        run: swamp workflow run ci-checks --json
