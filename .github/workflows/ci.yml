name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check extensions/

      - name: Lint
        run: deno lint extensions/

      - name: Test
        run: deno test extensions/ --allow-read --allow-env=SWAMP_INTEGRATION
