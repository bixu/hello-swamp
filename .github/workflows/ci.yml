name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2
        with:
          deno-version: v2.x

      - name: Install swamp
        run: curl -fsSL swamp.club/install.sh | sh

      - name: Initialize swamp repo
        run: swamp init --tool claude --force

      - name: Run ci-checks workflow
        run: swamp workflow run ci-checks --json
